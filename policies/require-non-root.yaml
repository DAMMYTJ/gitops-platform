apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-non-root
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
  matchConditions:
    - name: only-app-namespaces
      expression: "object.metadata.namespace in ['dev', 'staging', 'prod']"
  validationActions:
    - Audit
  validations:
    - expression: >
        object.spec.containers.all(c,
          c.?securityContext.?runAsNonRoot.orValue(false) == true ||
          object.spec.?securityContext.?runAsNonRoot.orValue(false) == true)
      message: "Containers must set runAsNonRoot: true."
