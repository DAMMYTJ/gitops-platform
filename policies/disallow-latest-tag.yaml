apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
  matchConditions:
    - name: only-app-namespaces
      expression: "object.metadata.namespace in ['dev', 'staging', 'prod']"
  validationActions:
    - Deny
  validations:
    - expression: >
        object.spec.containers.all(c,
          (c.image.contains(':') || c.image.contains('@')) &&
          !c.image.endsWith(':latest'))
      message: "Images need an explicit tag and must not use ':latest'."
