# Default values. Each environment overrides some of these in values-<env>.yaml

environment: dev

# The Secret holding the MySQL passwords. It is created by hand in each
# namespace (never stored in Git) with these keys:
#   mysql-password, mysql-root-password
secretName: mysql-credentials

ingress:
  host: dev.localhost

web:
  image: demo-web:1.0.0
  replicas: 1

api:
  image: demo-api:1.0.0
  version: "1.0.0"
  replicas: 1

mysql:
  image: mysql:8.4
  storage: 1Gi
  database: demo
  user: demo
