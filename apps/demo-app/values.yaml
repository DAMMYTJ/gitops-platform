# Default values. Each environment overrides some of these in values-<env>.yaml

environment: dev

# The Secret holding the MySQL passwords. OpenTofu creates it in each
# namespace from the encrypted infra/tofu/secrets.enc.yaml (see secrets.tf).
# Keys: mysql-password, mysql-root-password
secretName: mysql-credentials

ingress:
  host: dev.localhost

web:
  image: demo-web:1.0.0
  replicas: 1

api:
  image: demo-api:1.0.0
  version: "1.0.0"
  replicas: 1

mysql:
  image: mysql:8.4
  storage: 1Gi
  database: demo
  user: demo
